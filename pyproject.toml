[project]
name = "asistente"
version = "0.1.0"
description = "Proyecto integrador: asistente documental empresarial con IA"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.8",
    "httpx>=0.27",
    "pyjwt>=2.9",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
# Se instalan a medida que avanza el curso: uv sync --extra llm --extra docs
llm = ["openai>=1.40", "anthropic>=0.40"]
embeddings = ["sentence-transformers>=3.0"]
docs = ["pymupdf>=1.24", "pytesseract>=0.3", "pillow>=10"]

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "ruff>=0.6", "mypy>=1.11", "pre-commit>=3.8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/asistente"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "N", "ANN", "S"]
ignore = ["ANN401"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "ANN"]
"diagnostico/**" = ["S101", "ANN"]
"fundamentos/**" = ["S101", "ANN", "N818"]
"publicacion/plantilla/tests/**" = ["S101", "ANN"]
"prueba_final/**" = ["S101", "ANN", "B017"]

[tool.mypy]
strict = true
mypy_path = "src"
warn_unused_ignores = false

[[tool.mypy.overrides]]
module = ["sentence_transformers.*", "openai.*", "anthropic.*", "pytesseract.*", "PIL.*", "pymupdf.*"]
ignore_missing_imports = true
